services:
  postgres:
    image: postgres:17-alpine
    container_name: oilmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oilmart
      POSTGRES_USER: oilmart
      POSTGRES_PASSWORD: ${OILMART_POSTGRES_PASSWORD:-ChangeThisDatabasePassword}
    ports:
      - "5432:5432"
    volumes:
      - oilmart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oilmart -d oilmart"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  oilmart_postgres_data:
